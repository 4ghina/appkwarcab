    <script>
      // Gracefully prevent uncaught WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('@vite/client') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? String(e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
